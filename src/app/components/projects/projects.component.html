<div class="projects-container" [@fadeIn]="animationState">
  <div class="container">
    <h2>My Projects</h2>
    <p class="section-intro">Here are some of the projects I've worked on, showcasing my skills in full-stack development and cloud technologies.</p>
    
    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of projects; let i = index" [@cardAnimation]="{ value: animationState, params: { delay: i * 0.15 } }">
        <div class="project-image">
          <img [src]="project.image || 'assets/images/project-placeholder.jpg'" [alt]="project.name" class="project-img" />
          <div class="project-overlay">
            <div class="project-actions">
              <a [href]="project.demoLink" *ngIf="project.demoLink && project.demoLink.endsWith('.mp4')" class="project-action demo" title="Watch Demo" (click)="$event.preventDefault(); openVideoDemo(project.demoLink)">
                <i class="fas fa-play-circle"></i>
              </a>
              <a [href]="project.demoLink" *ngIf="project.demoLink && project.demoLink !== '#' && !project.demoLink.endsWith('.mp4')" class="project-action demo" target="_blank" title="Live Demo">
                <i class="fas fa-external-link-alt"></i>
              </a>
              <a [href]="project.githubLink" *ngIf="project.githubLink && project.githubLink !== '#'" class="project-action github" target="_blank" title="GitHub Repository">
                <i class="fab fa-github"></i>
              </a>
            </div>
          </div>
        </div>
        <div class="project-details">
          <h3>{{ project.name }}</h3>
          <p class="project-description">{{ project.description }}</p>
          
          <div class="project-tech">
            <h4>Technologies</h4>
            <div class="tech-tags">
              <span class="tech-tag" *ngFor="let tech of project.technologies">{{ tech }}</span>
            </div>
          </div>
          
          <div class="project-links">
            <a [href]="project.demoLink" *ngIf="project.demoLink && project.demoLink.endsWith('.mp4')" class="btn demo" (click)="$event.preventDefault(); openVideoDemo(project.demoLink)">
              <i class="fas fa-play"></i> Watch Demo
            </a>
            <a [href]="project.demoLink" *ngIf="project.demoLink && project.demoLink !== '#' && !project.demoLink.endsWith('.mp4')" class="btn demo" target="_blank">
              <i class="fas fa-external-link-alt"></i> Live Demo
            </a>
            <a [href]="project.githubLink" *ngIf="project.githubLink && project.githubLink !== '#'" class="btn github" target="_blank">
              <i class="fab fa-github"></i> View Code
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

<!-- Video Modal -->
<div class="video-modal" *ngIf="videoModal.isOpen">
  <div class="modal-overlay" (click)="closeVideoModal()"></div>
  <div class="modal-content">
    <button class="close-button" (click)="closeVideoModal()">
      <i class="fas fa-times"></i>
    </button>
    <video controls #videoPlayer>
      <source [src]="sanitizedVideoUrl" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
</div>
</div>
