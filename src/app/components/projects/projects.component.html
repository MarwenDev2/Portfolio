<div class="projects-container animate-on-scroll">
  <div class="container">
    <h2 class="animate-on-scroll delay-1">My Projects</h2>
    <p class="section-intro animate-on-scroll delay-2">Here are some of the projects I've worked on, showcasing my skills in full-stack development and cloud technologies.</p>
    
    <div class="projects-grid">
      <div class="project-card animate-on-scroll" *ngFor="let project of projects; let i = index" [style.animation-delay]="(i * 0.15) + 's'">
        <div class="project-image">
          <!-- 👇 If promo video exists, show it -->
          <ng-container *ngIf="project.promoVideo; else staticImage">
            <div class="video-wrapper" (click)="$event.stopPropagation()">
              <ng-container *ngIf="isGoogleDriveVideoUrl(project.promoVideo); else nativeProjectVideo">
                <iframe
                  class="project-video"
                  [src]="sanitizeUrl(normalizeVideoUrl(project.promoVideo))"
                  frameborder="0"
                  allow="autoplay; encrypted-media; picture-in-picture"
                  allowfullscreen>
                </iframe>
              </ng-container>

              <ng-template #nativeProjectVideo>
                <video
                  class="project-video"
                  [src]="normalizeVideoUrl(project.promoVideo)"
                  [poster]="'assets/images/projects/turathAI.png'">
                </video>
              </ng-template>

              <div class="video-overlay" *ngIf="!isGoogleDriveVideoUrl(project.promoVideo)">
                <i class="fas fa-play-circle"></i>
              </div>
            </div>
          </ng-container>
          
          <!-- 👇 Otherwise fallback -->
          <ng-template #staticImage>
            <ng-container *ngIf="project.image && project.image.length > 0; else singleImage">
              <img 
                [src]="project.image[currentSlideIndex[i] || 0]"
                class="project-img"
                [alt]="project.name" />
            </ng-container>

            <ng-template #singleImage>
              <img 
                [src]="project.image || 'assets/images/project-placeholder.jpg'" 
                class="project-img"
                [alt]="project.name" />
            </ng-template>
          </ng-template>


          <div class="project-overlay">
            <div class="project-actions">
              <!-- 👇 Promo video -->
              <a *ngIf="project.promoVideo" class="project-action demo" title="Watch Promo"
                 (click)="$event.preventDefault(); openVideoDemo(project.promoVideo)">
                <i class="fas fa-play-circle"></i>
              </a>

              <!-- 👇 GitHub -->
              <a [href]="project.githubLink" *ngIf="project.githubLink" class="project-action github" target="_blank" title="GitHub Repository">
                <i class="fab fa-github"></i>
              </a>
            </div>
          </div>
        </div>

        <div class="project-details">
          <h3>{{ project.name }}</h3>
          <p class="project-description">{{ project.description }}</p>
          
          <div class="project-tech">
            <h4>Technologies</h4>
            <div class="tech-tags">
              <span class="tech-tag" *ngFor="let tech of project.technologies">{{ tech }}</span>
            </div>
          </div>
          
          <div class="project-links">
            <a *ngIf="project.demoLink" class="btn demo" title="Watch Demo"
               (click)="$event.preventDefault(); openVideoDemo(project.demoLink)">
              <i class="fas fa-play"></i> Watch Demo
            </a>
            <!-- SINGLE REPO -->
            <a *ngIf="project.githubLink"
              [href]="project.githubLink"
              target="_blank"
              class="btn github">
              <i class="fab fa-github"></i> View Code
            </a>

            <!-- MULTIPLE REPOS -->
            <div *ngIf="project.repos" class="repo-button-wrapper">

              <button class="btn github"
                      (click)="toggleRepoMenu(project, $event)">
                <i class="fab fa-github"></i>
                View Code
                <i class="fas fa-chevron-down arrow"
                  [class.rotate]="project.isRepoMenuOpen"></i>
              </button>

              <div class="repo-dropdown"
                  *ngIf="project.isRepoMenuOpen">

                <a *ngIf="project.repos.frontend"
                  [href]="project.repos.frontend"
                  target="_blank"
                  class="repo-link">
                  Frontend Repository
                </a>

                <a *ngIf="project.repos.backend"
                  [href]="project.repos.backend"
                  target="_blank"
                  class="repo-link">
                  Backend Repository
                </a>

              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 🎬 Video Modal -->
  <div class="video-modal" *ngIf="videoModal.isOpen">
    <div class="modal-overlay" (click)="closeVideoModal()"></div>
    <div class="modal-content">
      <button class="close-button" (click)="closeVideoModal()">
        <i class="fas fa-times"></i>
      </button>
      <div class="video-frame">
        <ng-container *ngIf="isGoogleDriveVideoUrl(videoModal.videoUrl); else nativeVideoModal">
          <iframe
            [src]="sanitizeUrl(videoModal.videoUrl)"
            class="video-frame-embed"
            frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
          </iframe>
        </ng-container>

        <ng-template #nativeVideoModal>
          <video controls playsinline preload="metadata" #videoPlayer>
            <source [src]="sanitizedVideoUrl" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </ng-template>
      </div>
    </div>
  </div>
</div>
