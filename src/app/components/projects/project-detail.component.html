<div class="project-detail-container">
  <div class="detail-back">
    <a class="btn outline" [routerLink]="['/projects']">← Back to projects</a>
  </div>

  <div class="project-hero" *ngIf="project">
      <div class="logo-wrap">
        <img *ngIf="project.logo; else logoFallback" [src]="project.logo" [alt]="project!.name + ' logo'" />
        <ng-template #logoFallback>
          <img src="/assets/images/turathai-logo.png" alt="logo fallback" />
        </ng-template>
      </div>
      <h1 class="project-title">{{ project!.name }}</h1>
  </div>

  <div class="project-body">
    <section class="project-demo" *ngIf="project">
      <h2>Demonstration</h2>
      <div class="demo-grid">
        <div class="demo-card" *ngIf="project.promoVideo">
          <div class="card-header">
            <h4>Commercial</h4>
            <a *ngIf="getDriveViewerLink(project.promoVideo) as pv" [href]="pv" target="_blank" class="external-link" aria-label="Open commercial in Drive">⤢</a>
          </div>
          <div class="media-embed">
            <ng-container *ngIf="!promoPlaying">
              <div class="embed-poster" [ngStyle]="{'background-image': 'url(' + (imageArray ? imageArray[0] : imageUrl) + ')' }">
                <button class="play-btn" (click)="playPromo()" aria-label="Play commercial">▶</button>
              </div>
            </ng-container>
            <ng-container *ngIf="promoPlaying">
              <ng-container *ngIf="isPromoVideo; else promoIframeActive">
                <video controls autoplay [src]="project!.promoVideo"></video>
              </ng-container>
              <ng-template #promoIframeActive>
                <iframe [src]="sanitizedPromoUrl" frameborder="0" allowfullscreen></iframe>
              </ng-template>
            </ng-container>
          </div>
        </div>
        <br>
        <div class="demo-card" *ngIf="project.demoLink">
          <div class="card-header">
            <h4>Demo</h4>
            <a *ngIf="getDriveViewerLink(project.demoLink) as dv" [href]="dv" target="_blank" class="external-link" aria-label="Open demo in Drive">⤢</a>
          </div>
          <div class="media-embed">
            <ng-container *ngIf="!demoPlaying">
              <div class="embed-poster" [ngStyle]="{'background-image': 'url(' + (imageArray ? imageArray[0] : imageUrl) + ')' }">
                <button class="play-btn" (click)="playDemo()" aria-label="Play demo">▶</button>
              </div>
            </ng-container>
            <ng-container *ngIf="demoPlaying">
              <ng-container *ngIf="isDemoVideo; else demoIframeActive">
                <video controls autoplay [src]="project!.demoLink"></video>
              </ng-container>
              <ng-template #demoIframeActive>
                <iframe [src]="sanitizedDemoUrl" frameborder="0" allowfullscreen></iframe>
              </ng-template>
            </ng-container>
          </div>
        </div>
        <br>
        <div class="gallery-section" *ngIf="imageArray && imageArray.length > 0">
        <h3>Gallery</h3>
        <div class="carousel gallery-carousel">
          <button class="carousel-btn prev" (click)="prevImage()">‹</button>
          <img loading="lazy" [src]="imageArray[currentImageIndex]" [alt]="project!.name" />
          <button class="carousel-btn next" (click)="nextImage()">›</button>
          <div class="carousel-indicators">
            <span *ngFor="let img of imageArray; let idx = index" [class.active]="idx === currentImageIndex"></span>
          </div>
        </div>
      </div>
      </div>
    </section>

    <section class="project-details">
      <h2>Project Details</h2>
      <div class="project-after-media two-column">
        <div class="project-description details-box">
          <h3>Description</h3>
          <p>{{ project?.description }}</p>

          <div class="repo-row">
            <a *ngIf="project!.githubLink as gh" [href]="gh" target="_blank" class="btn github">View Code</a>
            <a *ngIf="project!.repos?.frontend as fe" [href]="fe" target="_blank" class="btn github">Frontend Repo</a>
            <a *ngIf="project!.repos?.backend as be" [href]="be" target="_blank" class="btn github">Backend Repo</a>
            <a *ngIf="project!.demoLink as dl" [href]="dl" target="_blank" class="btn outline">Open Demo</a>
          </div>
        </div>

        <aside class="project-meta">
          <div class="details-box tech-panel">
            <h3>Technologies</h3>
            <div class="tech-grid">
              <button class="tech-item" *ngFor="let t of project?.technologies" title="{{t}}">
                <i [class]="getTechIcon(t)"></i>
                <span class="tech-label">{{ t }}</span>
              </button>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </div>
</div>
