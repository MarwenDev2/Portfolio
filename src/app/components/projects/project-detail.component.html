<div class="project-detail-container">
  <div class="detail-back">
    <a class="btn outline" [routerLink]="['/projects']">← Back to projects</a>
  </div>

  <div class="project-hero" *ngIf="project">
    <div class="hero-media">
      <div class="carousel" *ngIf="imageArray && imageArray.length > 0">
        <button class="carousel-btn prev" (click)="prevImage()">‹</button>
        <img [src]="imageArray[currentImageIndex]" [alt]="project!.name" />
        <button class="carousel-btn next" (click)="nextImage()">›</button>
        <div class="carousel-indicators">
          <span *ngFor="let img of imageArray; let idx = index" [class.active]="idx === currentImageIndex"></span>
        </div>
      </div>
      <img *ngIf="(!imageArray || imageArray.length === 0) && !!imageUrl" [src]="imageUrl" [alt]="project!.name" />
      <img *ngIf="(!imageArray || imageArray.length === 0) && !imageUrl" src="/assets/images/turathai-logo.png" alt="project image" />
    </div>

    <div class="hero-info">
      <div class="title-row">
        <div class="logo-wrap" *ngIf="project.logo">
          <img [src]="project!.logo" [alt]="project!.name + ' logo'" />
        </div>
        <div>
          <h1 class="project-title">{{ project!.name }}</h1>
          <div class="project-links">
            <a *ngIf="project!.githubLink as gh" [href]="gh" target="_blank" class="btn github">
              <i class="fab fa-github"></i> View Code
            </a>
            <a *ngIf="project!.repos?.frontend as frontendUrl" [href]="frontendUrl" target="_blank" class="btn github">
              <i class="fab fa-github"></i> Frontend Repo
            </a>
            <a *ngIf="project!.repos?.backend as backendUrl" [href]="backendUrl" target="_blank" class="btn github">
              <i class="fab fa-github"></i> Backend Repo
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="project-body">
    <section class="project-demo" *ngIf="project">
      <h2>Demonstration</h2>
      <div class="demo-frame">
        <ng-container *ngIf="project.promoVideo">
          <h4>Commercial</h4>
          <ng-container *ngIf="isPromoVideo; else promoIframe">
            <video controls [src]="project!.promoVideo" [poster]="imageArray ? imageArray[0] : imageUrl"></video>
          </ng-container>
          <ng-template #promoIframe>
            <iframe [src]="sanitizedPromoUrl" frameborder="0" allowfullscreen></iframe>
          </ng-template>
        </ng-container>

        <ng-container *ngIf="project.demoLink">
          <h4>Demo</h4>
          <ng-container *ngIf="isDemoVideo; else demoIframe">
            <video controls [src]="project!.demoLink" [poster]="imageArray ? imageArray[0] : imageUrl"></video>
          </ng-container>
          <ng-template #demoIframe>
            <iframe [src]="sanitizedDemoUrl" frameborder="0" allowfullscreen></iframe>
          </ng-template>
        </ng-container>
      </div>
    </section>

    <section class="project-details">
      <h2>Project Details</h2>
      <div class="project-after-media">
        <div class="project-description">
          <p>{{ project?.description }}</p>
        </div>

        <div class="technologies-block">
          <h3>Technologies Used</h3>
          <div class="tech-list">
            <span class="tech-tag" *ngFor="let t of project?.technologies">
              <i [class]="getTechIcon(t)"></i>
              {{ t }}
            </span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
