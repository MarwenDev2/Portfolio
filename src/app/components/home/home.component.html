<section class="home-container animate-on-scroll">
  <div class="hero">
    <div class="hero-content animate-on-scroll delay-1">
      <h1 class="title animate-on-scroll delay-2">Marwen <span class="highlight">Feki</span> <span class="wave">👋</span></h1>
      <h2 class="subtitle animate-on-scroll delay-3">Software Engineering Intern &#64; Airbus | Cloud & DevOps Engineer</h2>
      
      <div class="cta-buttons animate-on-scroll delay-4">
        <a href="#about" class="btn primary">
          <i class="fas fa-user"></i> About Me
        </a>
        <a href="#projects" class="btn secondary">
          <i class="fas fa-code"></i> View My Work
        </a>
        <a href="https://github.com/MarwenDev2" target="_blank" class="btn github">
          <i class="fab fa-github"></i> GitHub
        </a>
      </div>
    </div>

    <div class="hero-image animate-on-scroll delay-3">
      <div class="profile-image-container">
        <img src="/assets/images/ME.png" alt="Marwen Feki" class="profile-image" />
        <div class="image-backdrop"></div>
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
      </div>
    </div>
  </div>

  <div class="featured-projects animate-on-scroll delay-5">
    <h3>Featured Projects</h3>
    <div class="project-cards">
      <div class="project-card animate-on-scroll" *ngFor="let project of featuredProjects; let i = index" [style.animation-delay]="(i * 0.15) + 's'">
        
        <div class="project-image">
          <ng-container *ngIf="project.promoVideo; else staticImage">
            <div class="video-wrapper" (click)="$event.stopPropagation()">
              <ng-container *ngIf="isGoogleDriveVideoUrl(project.promoVideo); else nativeProjectVideo">
                <iframe
                  class="project-video"
                  [src]="sanitizeUrl(normalizeVideoUrl(project.promoVideo))"
                  frameborder="0"
                  allow="autoplay; encrypted-media; picture-in-picture"
                  allowfullscreen>
                </iframe>
              </ng-container>

              <ng-template #nativeProjectVideo>
                <video
                  class="project-video"
                  [src]="normalizeVideoUrl(project.promoVideo)"
                  [poster]="'assets/images/projects/turathAI.png'">
                </video>
              </ng-template>

              <div class="video-overlay" *ngIf="!isGoogleDriveVideoUrl(project.promoVideo)">
                <i class="fas fa-play-circle"></i>
              </div>
            </div>
          </ng-container>

          <ng-template #staticImage>
            <ng-container *ngIf="project.image && project.image.length > 0">
              <img 
                [src]="project.image[currentSlideIndex[i] || 0]"
                class="project-img"
                [alt]="project.name" />
            </ng-container>
          </ng-template>

          <div class="project-overlay" (click)="$event.stopPropagation()">
            <div class="project-links">
              <a *ngIf="project.githubLink"
                [href]="project.githubLink"
                target="_blank"
                class="project-action github"
                title="GitHub Repository"
                (click)="$event.stopPropagation()">
                <i class="fab fa-github"></i>
              </a>
            </div>
          </div>
        </div>
        <br>
        <div class="project-content">
          <h4>{{ project.name }}</h4>
          <p>{{ project.description }}</p>
          <br>
          <div class="project-tags">
            <span *ngFor="let tag of project.tags">{{ tag }}</span>
          </div>
          <br>
          <div class="project-buttons">
            <a *ngIf="project.demoLink" class="btn demo" title="Watch Demo"
               (click)="$event.preventDefault(); openVideoDemo(project.demoLink)">
              <i class="fas fa-play"></i> Demo
            </a>
            <a [href]="project.githubLink" *ngIf="project.githubLink" target="_blank" class="btn github">
              <i class="fab fa-github"></i> Repository
            </a>
          </div>
          <br>
        </div>
      </div>
    </div>
    
    <div class="view-more">
      <a href="#projects" class="btn outline">
        <i class="fas fa-th-large"></i> View All Projects
      </a>
    </div>
  </div>
</section>

<!-- 🎬 Video Modal -->
<div class="video-modal" *ngIf="videoModal.isOpen">
  <div class="modal-overlay" (click)="closeVideoModal()"></div>
  <div class="modal-content">
    <button class="close-button" (click)="closeVideoModal()">
      <i class="fas fa-times"></i>
    </button>

    <ng-container *ngIf="isGoogleDriveVideoUrl(videoModal.videoUrl); else nativeVideoModal">
      <iframe
        [src]="sanitizeUrl(videoModal.videoUrl)"
        class="video-frame-embed"
        frameborder="0"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </ng-container>

    <ng-template #nativeVideoModal>
      <video controls #videoPlayer>
        <source [src]="sanitizedVideoUrl" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </ng-template>
  </div>
</div>
