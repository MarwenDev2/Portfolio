<section class="home-container animate-on-scroll">
  <div class="hero">
    <div class="hero-content animate-on-scroll delay-1">
      <h1 class="title animate-on-scroll delay-2">Marwen <span class="highlight">Feki</span> <span class="wave">👋</span></h1>
      <h2 class="subtitle animate-on-scroll delay-3">Software Engineering Intern &#64; Airbus | Cloud & DevOps Engineer</h2>
      
      <div class="cta-buttons animate-on-scroll delay-4">
        <a href="#about" class="btn primary">
          <i class="fas fa-user"></i> About Me
        </a>
        <a href="#projects" class="btn secondary">
          <i class="fas fa-code"></i> View My Work
        </a>
        <a href="https://github.com/MarwenDev2" target="_blank" class="btn github">
          <i class="fab fa-github"></i> GitHub
        </a>
      </div>
    </div>

    <div class="hero-image animate-on-scroll delay-3">
      <div class="profile-image-container">
        <img src="/assets/images/ME.png" alt="Marwen Feki" class="profile-image" />
        <div class="image-backdrop"></div>
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
      </div>
    </div>
  </div>

  <div class="featured-projects animate-on-scroll delay-5">
    <h3>Featured Projects</h3>
    <div class="project-cards">
      <div class="project-card animate-on-scroll" *ngFor="let project of featuredProjects; let i = index" [style.animation-delay]="(i * 0.15) + 's'">
        
        <div class="project-image">
          <a class="media-wrapper" [routerLink]="['/projects', project._index]">
            <ng-container *ngIf="project.image && project.image.length; else singleImage">
              <img class="project-img" [src]="project.image[currentSlideIndex[i] || 0]" [alt]="project.name" />
            </ng-container>
            <ng-template #singleImage>
              <img class="project-img" [src]="project.image || 'assets/images/projects/turathAI.png'" [alt]="project.name" />
            </ng-template>
          </a>
        </div>
        <br>
        <div class="project-content">
          <h4>{{ project.name }}</h4>
          <p>{{ project.description }}</p>
          <br>
          <div class="project-tags">
            <span *ngFor="let tag of project.tags">{{ tag }}</span>
          </div>
          <br>
          <div class="project-buttons">
            <a [routerLink]="['/projects', project._index]" class="btn primary">View Project</a>
            <a [href]="project.githubLink" *ngIf="project.githubLink" target="_blank" class="btn github">Repository</a>
          </div>
          <br>
        </div>
      </div>
    </div>
    
    <div class="view-more">
      <a href="#projects" class="btn outline">
        <i class="fas fa-th-large"></i> View All Projects
      </a>
    </div>
  </div>
</section>
